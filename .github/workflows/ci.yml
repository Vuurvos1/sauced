name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter @app/site check

      # Search tests run against in-memory Postgres (PGlite), so no service is needed.
      - name: Unit tests
        run: |
          pnpm --filter @app/site exec vitest --run
          pnpm --filter @app/scraper exec vitest --run

  e2e:
    runs-on: ubuntu-latest

    # Matches db-test in docker-compose.yaml and DATABASE_URL in apps/site/.env.test.
    # Keep the major version in step with production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sauced_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sauced_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @app/site exec playwright install --with-deps chromium

      # Not `test:integration`: that starts the docker compose database, which the
      # service above replaces.
      - name: End-to-end tests
        run: pnpm --filter @app/site exec playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/site/playwright-report
            apps/site/test-results
          retention-days: 7
