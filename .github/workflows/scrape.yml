name: Scrape sauces

on:
  push:
    branches:
      - dev
    paths:
      - 'packages/scraper/**'
      - 'packages/db/**'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:
    inputs:
      store:
        type: string
        description: 'A store key from stores.js, or "all"'
        required: true
        default: 'all'

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm --filter "@app/scraper..." install --frozen-lockfile

      - name: Run scrapers
        # `all` is resolved by the CLI, which runs every store before failing so
        # one broken adapter does not hide the state of the others.
        # Only main gets full catalogues; everywhere else takes the 12-sauce sample.
        run: |
          store='${{ github.event_name == 'workflow_dispatch' && inputs.store || 'all' }}'
          dev_flag='--dev'
          [[ "${{ github.ref }}" == 'refs/heads/main' ]] && dev_flag=''

          pnpm scrapers scrape "$store" --dbInsert $dev_flag
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
