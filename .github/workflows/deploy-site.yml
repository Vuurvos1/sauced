name: Deploy site

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/deploy-site.yml'
      - 'apps/site/**'
      - 'packages/db/**'
      - 'packages/boring-avatars/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

# A newer push replaces a deploy still in flight; two never race to be last.
concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only public, build-time values here. The build loads the server to analyse
      # routes, so the runtime variables must exist, but they are not inlined: the
      # real values are Worker secrets (see apps/site/README.md). Better Auth refuses
      # an empty secret even then, hence the placeholder.
      - name: Build
        run: pnpm --filter @app/site build
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          BETTER_AUTH_SECRET: build-placeholder-not-used-at-runtime
          GOOGLE_CLIENT_ID: ''
          GOOGLE_CLIENT_SECRET: ''
          RESEND_API_KEY: ''

      - name: Deploy
        working-directory: apps/site
        run: pnpm wrangler deploy --env ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
