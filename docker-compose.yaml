services:
  db:
    image: postgres:16
    container_name: sauced_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sauced
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  db-test:
    image: postgres:16
    container_name: sauced_postgres_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sauced_test
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 1s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  # Workers AI's REST API for review moderation, with a word list in place of the
  # model. Point the site at it with CLOUDFLARE_API_BASE_URL.
  ai:
    image: node:24-alpine
    container_name: sauced_ai
    command: node /app/server.mjs
    environment:
      FLAG_WORDS: 'idiot,hate you,scam,garbage'
    volumes:
      - ./docker/ai:/app:ro
    ports:
      - '8788:8788'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8788/health']
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
